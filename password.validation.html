<!doctype html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Регистрация</title>
</head>
<body>
 <main>
 <h1>Регистрация</h1>


 <p>
 <label for="login">Логин</label>
 <input id="login" type="text" autocomplete="username">
 </p>
 <p>
 <label for="email">Электронная почта</label>
 <input id="email" type="email" autocomplete="email">
 </p>
  <p>
 <label for="name">Имя</label>
 <input id="name" type="text" autocomplete="name">
 </p>
 <p>
 <label for="password">Пароль</label>
 <input id="password" type="password" autocomplete="new-password">
 </p>


 <h2>Требования</h2>
 <ul>
 <li id="length">Не менее 10 символов</li>
 <li id="max_length" hidden>Пароль слишком длинный</li>
 <li id="lowercase">Есть строчная буква</li>
 <li id="uppercase">Есть заглавная буква</li>
 <li id="number">Есть цифра</li>
 <li id="symbol">Есть специальный символ</li>
 <li id="personal" hidden>Рекомендация: не включайте в пароль логин, email или имя</li>
 </ul>


 </main>
 <script src="password.validation.js" defer></script>
</body>
</html>
