<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Последний звонок в 23:17</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <main class="screen-container">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title" class="game-title">Вход</h1>
            <p class="login-note">
                Страница входа открывается, но проверка email и пароля на сервере
                пока не подключена.
            </p>
            <form id="login-form">
                <label for="login-email">Почта</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required>

                <label for="login-password">Пароль</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>

                <button class="menu-btn-main" type="submit">Войти</button>
                <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
            </form>
            <a class="back-link" href="/">Вернуться в меню</a>
        </section>
    </main>
    <script src="/static/js/login.js"></script>
</body>
</html>
