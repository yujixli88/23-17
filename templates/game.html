<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-ru="Игра - Сюжет" data-en="Game - Story">Игра - Сюжет</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="game-container">
        <!-- Кнопка меню (3 полоски) -->
        <button class="menu-btn" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </button>

        <!-- Боковая панель -->
        <div class="sidebar" id="sidebar">
            <button class="close-sidebar" onclick="toggleSidebar()" style="align-self:flex-end; background:none; border:none; color:#777; font-size:22px; cursor:pointer;">×</button>

            <div class="profile-section" style="border:1px solid #333; padding:10px; text-align:center; margin-bottom:15px;">
                <div style="color:#c0392b; font-size:20px;">👤</div>
                <div id="profile-status" data-ru="Гость" data-en="Guest"
                     style="font-size:12px; color:#aaa; margin-top:5px;">Гость</div>
            </div>

            <div class="rank-box" style="background:#141414; border:1px solid #444; padding:8px; margin-bottom:15px; font-size:12px; display:flex; justify-content:space-between;">
                <div><span data-ru="Ранг:" data-en="Rank:">Ранг:</span>
                    <span id="rank-display" data-ru="Базовый уровень" data-en="Basic level"
                          style="color:#f1c40f;">Базовый уровень</span>
                </div>
                <div>✨ <span id="glitters-display" style="color:#3498db;">0</span></div>
            </div>

            <button class="menu-btn-main" onclick="goToMenu()"
                    data-ru="В главное меню" data-en="Back to main menu"
                    style="margin-top:auto; width:100%; font-size:12px; padding:8px;">В главное меню</button>
        </div>

        <!-- Окно диалога -->
        <div class="dialogue-box" onclick="nextLine()">
            <div class="speaker-name" id="speaker"></div>
            <div class="dialogue-text" id="text"></div>
        </div>
    </div>
    <script src="/static/js/language.js"></script>
    <script src="/static/js/game-loader.js"></script>
</body>
</html>
